# Per-repo no-mistakes overrides (honored from the default-branch copy).
#
# Pin the Lint and Test steps to the commands .github/workflows/ci.yml already
# runs, so validation is declared here instead of decided per run by the agent.
# Four lint gates share one command: ruff (pyflakes + syntax), mypy (typed
# half, zero-error baseline), lint-imports (the layer order as a contract) and
# yamllint (workflow YAML, a real gate) - all configured in pyproject.toml or
# passed inline, matching ci.yml. Not declared: gitleaks (CI fetches a
# sha256-pinned binary via the secrets-scan template; it is a secrets scan,
# not lint).
commands:
  lint: >-
    ruff check . && mypy && lint-imports &&
    yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' .github/workflows/
  test: 'TMPDIR=$(mktemp -d) python -m pytest -q'
