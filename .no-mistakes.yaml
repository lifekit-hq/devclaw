# Per-repo no-mistakes overrides (honored from the default-branch copy).
#
# Pin the Lint and Test steps to the commands .github/workflows/ci.yml already
# runs, so validation is declared here instead of decided per run by the agent.
# Four lint gates share one command: ruff (pyflakes + syntax), mypy (typed
# half, zero-error baseline), lint-imports (the layer order as a contract) and
# yamllint (workflow YAML, a real gate) - all configured in pyproject.toml or
# passed inline, matching ci.yml. Not declared: gitleaks (CI fetches a
# sha256-pinned binary via the secrets-scan template; it is a secrets scan,
# not lint), and the console's Playwright e2e (it needs a downloaded browser;
# CI's frontend job runs it).
commands:
  # The repo-local Python env (CI's `pip install -e '.[dev]'`, in .venv) and
  # the CI frontend job's `npm ci`. lint and test call the env's tools by path,
  # so the host PATH needs neither python nor ruff/mypy/yamllint.
  prepare: >-
    { [ -x .venv/bin/python ] || python3 -m venv .venv; } &&
    .venv/bin/python -m pip install -q -e '.[dev]' &&
    cd frontend && npm ci
  lint: >-
    .venv/bin/ruff check . && .venv/bin/mypy && .venv/bin/lint-imports &&
    .venv/bin/yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' .github/workflows/ &&
    cd frontend && npm run lint
  test: 'TMPDIR=$(mktemp -d) .venv/bin/python -m pytest -q && cd frontend && npm test && npm run build'
