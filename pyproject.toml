[project]
name = "devclaw"
version = "2.0.0"
description = "DevClaw — MCP server driving an autonomous software-development loop in per-task sandboxes"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
devclaw-mcp = "devclaw.server:main"
devclaw = "devclaw.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.6", "ruff>=0.8", "mypy>=1.14", "import-linter>=2.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devclaw"]
# The console bundle (devclaw/server/console_dist) is BUILT during the image
# build (npm run build), not committed — it's .gitignored. hatchling respects
# VCS ignores by default, so force-include the built output here or the wheel
# ships without a console (server 503s). Glob matches the vite output tree.
artifacts = ["devclaw/server/console_dist/**"]

# Since spec 046 the scaffold is baked into the SANDBOX image
# (/opt/devclaw/specify) and the session copies it into a repo that has none;
# the host package no longer carries it.

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The suite is fully stubbed and process-independent (every test gets its own
# tmp_path / SQLite file), so it parallelises cleanly: ~113s serial -> ~20s on
# 16 cores. Speed is not a nicety here — a suite nobody wants to wait for is a
# suite that gets run less often. Override with `-n0` when debugging a single
# test (xdist swallows pdb and interleaves output).
addopts = "-n auto"
# The stub engine writes placeholder test_*.py into per-run sandbox workspaces
# under evals/runs/; if pytest auto-discovers those it tries to import them
# (and fails on bare filenames not part of the suite). Pin collection to tests/.
testpaths = ["tests"]
norecursedirs = ["evals/runs", ".venv", "build", "*.egg-info"]

# Type checking — the other half of the correctness gate. Ruff's F821 catches
# the *undefined* name a refactor leaves dangling; mypy catches the *wrong-typed*
# one on the path no test executes (the class of bug behind the mixin/`InFlight`
# type-lies this gate's introduction fixed). Default strictness on purpose:
# zero errors at adoption, ratchet (strict flags, per-module) later, never loosen.
[tool.mypy]
files = ["devclaw", "runner"]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
# `/live-shakedown` writes generated scratch repos into .shakedown/ — agent
# output, not this codebase. It is untracked (so CI never sees it), but a
# developer running `ruff check .` would get findings from code nobody here
# wrote. Excluded so the local command matches what the gate actually gates.
extend-exclude = [".shakedown"]

[tool.ruff.lint]
# Deliberately narrow: pyflakes (F) + syntax/IO errors (E9), not style. The
# load-bearing rule is F821 undefined-name — the failure mode that keeps biting
# refactors here is a name a move left dangling, invisible until the route or
# branch that hits it runs (the stubbed suite covers a lot, but not every
# line). F401 pulls its weight too: the #625 http.py split left 15 dead imports
# behind in devclaw/server/routes/. Formatting stays a human call; this gate
# only reports things that are wrong, never things that are merely unfashionable.
select = ["F", "E9"]

# Import contracts — the modular monolith's boundaries, enforced (`lint-imports`;
# CI gates it beside ruff and mypy). The layer order is the one CLAUDE.md states;
# the leaf contracts pin the packages that must stay extraction-ready (loom is
# the seam, the runner is standalone by spec 011). A contract is a declared
# fact about the architecture: a new upward edge fails here, never silently
# in a later refactor. Adding an `ignore_imports` line is taking on debt in
# public — say why in the same PR. (tinyspec `import-contracts`, 2026-09-06)
[tool.importlinter]
root_packages = ["devclaw", "runner"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "runner is a leaf — the sandbox runner never imports devclaw (spec 011)"
type = "forbidden"
source_modules = ["runner"]
forbidden_modules = ["devclaw"]

[[tool.importlinter.contracts]]
name = "loom is a leaf — the extraction seam imports nothing from devclaw"
type = "forbidden"
source_modules = ["devclaw.loom"]
forbidden_modules = ["devclaw.*"]

[[tool.importlinter.contracts]]
name = "config is a leaf — only the dotenv bootstrap below it"
type = "forbidden"
source_modules = ["devclaw.config"]
forbidden_modules = ["devclaw.*"]
ignore_imports = ["devclaw.config -> devclaw._env_loader"]

[[tool.importlinter.contracts]]
name = "dispatch_gate is a leaf — pure window math over config"
type = "forbidden"
source_modules = ["devclaw.dispatch_gate"]
forbidden_modules = ["devclaw.*"]
ignore_imports = ["devclaw.dispatch_gate -> devclaw.config"]

[[tool.importlinter.contracts]]
name = "credentials is a leaf — the one registry of credential names and hops imports nothing (spec 042)"
type = "forbidden"
source_modules = ["devclaw.credentials"]
forbidden_modules = ["devclaw.*"]

[[tool.importlinter.contracts]]
name = "state_store imports only config — the store knows no gate, queue, or goal"
type = "forbidden"
source_modules = ["devclaw.state_store"]
forbidden_modules = ["devclaw.*"]
ignore_imports = ["devclaw.state_store.* -> devclaw.config"]

[[tool.importlinter.contracts]]
name = "CLAUDE.md layer order (server > goal > queue > delivery/gates > engine > store > loom/config)"
type = "layers"
layers = [
    "devclaw.server | devclaw.cli",
    "devclaw.doctor",
    "devclaw.goal",
    "devclaw.task_queue : devclaw.queue",
    "devclaw.delivery | devclaw.gates",
    "devclaw.engine",
    "devclaw.state_store",
    "devclaw.loom | devclaw.config",
]

[[tool.importlinter.contracts]]
name = "the goal layer is the only place that reads GitHub as state (spec 046)"
type = "forbidden"
source_modules = ["devclaw.task_queue", "devclaw.queue", "devclaw.engine", "devclaw.state_store"]
forbidden_modules = ["devclaw.goal"]
