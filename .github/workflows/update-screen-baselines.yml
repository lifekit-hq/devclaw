name: Update screen baselines

# The one step that rewrites the console's screen baselines (frontend/e2e/screens/, held by
# lifekit-common's fixture). lifekit-common's reusable workflow renders them on the CI runner, the
# machine every comparison runs on, commits the changed images to the branch, starts CI on it and
# posts the before and after on the pull request. Run it from the Actions tab on a branch whose
# screens changed on purpose, or add the `update-baselines` label to the pull request (which also
# works before this file is on the default branch). It never runs on main.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-baselines'
    permissions:
      contents: write
      actions: write
      pull-requests: write
      packages: read  # @lifekit-hq/* from GitHub Packages
    uses: lifekit-hq/lifekit-common/.github/workflows/screen-baselines.yml@v4.4.1
    with:
      lifekit-common-ref: v4.4.1
      working-directory: frontend
      # @lifekit-hq/* installs from GitHub Packages; the token is this job's, with `packages: read`.
      install-command: NODE_AUTH_TOKEN=${{ github.token }} npm ci --no-audit --no-fund
      build-command: npm run build
      command: SCREEN_BASELINES=update npx playwright test -g "screen baseline" --update-snapshots=changed
      baselines: frontend/e2e/screens
      commit-message: "test(console): update screen baselines"
