name: Release Please

on:
  push:
    branches: [main]
  # Manual "run it now" escape hatch — the weekly-release template merges with
  # the release-bot app token, so that merge is a real push and fires this
  # workflow's push trigger on its own; no explicit dispatch is needed.
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: lifekit-hq/.github/.github/workflows/release-please.yml@v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
