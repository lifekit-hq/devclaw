name: Deploy devclaw

# Two lanes since spec 025 (ruled by Denys 2026-08-29, amending spec 005
# FR-008's "operator-triggered ONLY"):
#   manual (auto=false, the default): the operator's deliberate button-press,
#     byte-compatible with the original behavior — no rollback magic.
#   auto (auto=true): devclaw triggers this itself after a devclaw-repo
#     merge-on-close, once the instance is task-quiescent (the quiescence gate
#     lives instance-side — self_deploy.maybe_trigger — so a routine merge can
#     never SIGKILL an in-flight sandbox, which was FR-008's original point).
#     The deploy runs through deploy-devclaw-auto.sh: probe-checked, ONE
#     automatic rollback to the previously running SHA, instance-dead relay
#     ping if even the rollback fails.
on:
  # A main commit whose images Docker Build published ARMS a self-deploy; it
  # does not deploy here. The instance owns the timing, because it is the only
  # place that can see whether a task is running — see the `arm` job below.
  # Only a successful build of a push to main arms, so a failed or partial
  # publish never reaches the box.
  workflow_run:
    workflows: [Docker Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (blank = this commit, once Docker Build has published its SHA)'
        required: false
        default: ''
      auto:
        description: 'Unattended lane: probe + one automatic rollback (set by devclaw self-deploy)'
        required: false
        default: 'false'

permissions: {}

jobs:
  # ---- arm lane (Docker Build published a main commit) ---------------------
  # Tells the instance "main moved". The heartbeat then waits for task
  # quiescence and fires this same workflow's auto lane (spec 025 US2), so an
  # in-flight sandbox is never SIGKILLed by a recreate. Runs on the self-hosted
  # runner because the instance is reachable only on the box's loopback.
  #
  # Why arm instead of deploy: quiescence is a fact only the instance holds.
  # Checking it here would be a second gate answering the same question from
  # worse information, and a race between them is a killed sandbox.
  arm:
    name: Arm a self-deploy (instance picks the moment)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    permissions: {}
    steps:
      - name: Arm
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          # The token is read from the box's own env file, never from an Actions
          # secret: the runner is ON the VPS, so the credential has no reason to
          # take a trip through GitHub and gain a hop it does not need (#894).
          ENV_FILE="${DEVCLAW_ENV_FILE:-/srv/devclaw/.env}"
          TOKEN="$(sudo -n grep -m1 -E '^DEVCLAW_TOKEN=' "$ENV_FILE" 2>/dev/null | cut -d= -f2- || true)"
          [ -n "$TOKEN" ] || TOKEN="$(grep -m1 -E '^DEVCLAW_TOKEN=' "$ENV_FILE" 2>/dev/null | cut -d= -f2- || true)"
          code=$(curl -sS -o /tmp/arm.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            -d "{\"sha\": \"${SHA}\"}" \
            http://127.0.0.1:18791/control/deploy-pending) || code=000
          echo "arm → HTTP $code"; cat /tmp/arm.out 2>/dev/null || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::could not arm the self-deploy (HTTP $code). main is ahead of the running instance; deploy by hand via workflow_dispatch."
            exit 1
          fi

  # ---- deploy lane (workflow_dispatch) -------------------------------------
  # Resolves the tag and waits — on a hosted runner, so the box's runner is not
  # held — until ghcr has both images for it. A blank tag is this commit's SHA,
  # whose Docker Build may still be running: the heartbeat can fire a deploy of
  # main's head (the reconcile path) before its images are published. A named
  # tag (a rollback) must already exist. Fails before the box is touched.
  images:
    name: Wait for the published images
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read      # the Docker Build run for this commit
      packages: read     # manifest reads on ghcr.io
    outputs:
      tag: ${{ steps.id.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: id
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$(tr -d '[:space:]' <<< "${INPUT_TAG:-$GITHUB_SHA}")"
          if ! [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$tag' is not a valid image tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploying tag $tag"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Wait for ghcr to carry both images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.id.outputs.tag }}
          NAMED: ${{ github.event.inputs.tag != '' }}
        run: |
          set -uo pipefail
          published() {
            docker manifest inspect "ghcr.io/lifekit-hq/devclaw-mcp:$TAG" >/dev/null 2>&1 &&
            docker manifest inspect "ghcr.io/lifekit-hq/devclaw-sandbox:$TAG" >/dev/null 2>&1
          }
          deadline=$((SECONDS + 45 * 60)) seen=false
          until published; do
            if [[ $NAMED == true ]]; then
              echo "::error::ghcr.io/lifekit-hq/devclaw-{mcp,sandbox}:$TAG not found — was that commit published by Docker Build?"
              exit 1
            fi
            run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow docker-build.yml --commit "$TAG" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[] | "\(.status) \(.conclusion) \(.url)"' 2>/dev/null || true)"
            read -r status conclusion url <<< "$run"
            [[ -n $status ]] && seen=true
            if [[ $status == completed ]]; then
              published && break   # it finished between the two reads
              echo "::error::Docker Build for $TAG finished '$conclusion' without publishing both images: $url"
              exit 1
            fi
            # Only a push to main publishes; a commit with no such run after a
            # few minutes (a dispatch from a branch) never will.
            if [[ $seen == false ]] && (( SECONDS >= 5 * 60 )); then
              echo "::error::no Docker Build push run for $TAG — only a commit pushed to main is published"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::no published images for $TAG after 45 min (Docker Build: ${run:-no run found})"
              exit 1
            fi
            echo "waiting for Docker Build of $TAG (${status:-no run yet})"
            sleep 30
          done
          echo "ghcr carries devclaw-mcp:$TAG and devclaw-sandbox:$TAG"

  deploy:
    name: Pull (ghcr) → deploy to lifekit-vps
    needs: images
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    concurrency:
      group: deploy-lifekit-vps
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read     # pull devclaw-mcp + devclaw-sandbox from ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Scoped deploy — pulls the tag, recreates ONLY the devclaw project,
      # verifies /health, fails loud. OpenClaw-side containers are untouched.
      - name: Deploy (scoped, readiness-gated)
        # Every credential the instance cannot run without rides in from the
        # repo secrets — the source of truth. deploy-devclaw.sh writes them into
        # the on-box secrets file the compose file declares as its env_file
        # (/srv/devclaw/secrets.env, 0600), so a later recreate from the box —
        # by ANY path — reads the same values instead of resolving to blank
        # (2026-09-03). Unset/blank or malformed ⇒ the script dies BEFORE
        # touching the box; the container refuses to start without them.
        env:
          # subscription OAuth setup-token: host cognition + sandbox auth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # read:packages registry token: in-sandbox `npm ci` on @lifekit-hq
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          # host-side GitHub (`repo` + `actions:read`): delivery push/PR/merge,
          # intake, the issue doorway, and the failing-job log read that feeds a
          # red-CI correction. NOT `secrets.GITHUB_TOKEN` — that is the job's
          # own hourly-expiring token, and GitHub forbids a `GITHUB_`-prefixed
          # secret name, which is why the registry spells this one GH_TOKEN.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # the auto lane's instance-dead relay ping target (optional secret;
          # unset ⇒ the wrapper skips the ping, everything else unchanged)
          DEVCLAW_NOTIFY_URL: ${{ secrets.DEVCLAW_NOTIFY_URL }}
        run: |
          if [ "${{ github.event.inputs.auto }}" = "true" ]; then
            bash deploy/deploy-devclaw-auto.sh "${{ needs.images.outputs.tag }}"
          else
            bash deploy/deploy-devclaw.sh "${{ needs.images.outputs.tag }}"
          fi
