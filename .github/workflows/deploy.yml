name: Deploy devclaw

# Two lanes since spec 025 (ruled by Denys 2026-08-29, amending spec 005
# FR-008's "operator-triggered ONLY"):
#   manual (auto=false, the default): the operator's deliberate button-press,
#     byte-compatible with the original behavior — no rollback magic.
#   auto (auto=true): devclaw triggers this itself after a devclaw-repo
#     merge-on-close, once the instance is task-quiescent (the quiescence gate
#     lives instance-side — self_deploy.maybe_trigger — so a routine merge can
#     never SIGKILL an in-flight sandbox, which was FR-008's original point).
#     The deploy runs through deploy-devclaw-auto.sh: probe-checked, ONE
#     automatic rollback to the previously running SHA, instance-dead relay
#     ping if even the rollback fails.
on:
  # A merge to main ARMS a self-deploy; it does not deploy here. The instance
  # owns the timing, because it is the only place that can see whether a task
  # is running — see the `arm` job below.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (blank = build this commit and deploy its SHA)'
        required: false
        default: ''
      auto:
        description: 'Unattended lane: probe + one automatic rollback (set by devclaw self-deploy)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write        # push devclaw-mcp + devclaw-sandbox to ghcr.io

jobs:
  # ---- arm lane (push to main) ------------------------------------------
  # Tells the instance "main moved". The heartbeat then waits for task
  # quiescence and fires this same workflow's auto lane (spec 025 US2), so an
  # in-flight sandbox is never SIGKILLed by a recreate. Runs on the self-hosted
  # runner because the instance is reachable only on the box's loopback.
  #
  # Why arm instead of deploy: quiescence is a fact only the instance holds.
  # Checking it here would be a second gate answering the same question from
  # worse information, and a race between them is a killed sandbox.
  arm:
    name: Arm a self-deploy (instance picks the moment)
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Arm
        run: |
          set -uo pipefail
          # The token is read from the box's own env file, never from an Actions
          # secret: the runner is ON the VPS, so the credential has no reason to
          # take a trip through GitHub and gain a hop it does not need (#894).
          ENV_FILE="${DEVCLAW_ENV_FILE:-/srv/devclaw/.env}"
          TOKEN="$(sudo -n grep -m1 -E '^DEVCLAW_TOKEN=' "$ENV_FILE" 2>/dev/null | cut -d= -f2- || true)"
          [ -n "$TOKEN" ] || TOKEN="$(grep -m1 -E '^DEVCLAW_TOKEN=' "$ENV_FILE" 2>/dev/null | cut -d= -f2- || true)"
          code=$(curl -sS -o /tmp/arm.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            -d "{\"sha\": \"${GITHUB_SHA}\"}" \
            http://127.0.0.1:18791/control/deploy-pending) || code=000
          echo "arm → HTTP $code"; cat /tmp/arm.out 2>/dev/null || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::could not arm the self-deploy (HTTP $code). main is ahead of the running instance; deploy by hand via workflow_dispatch."
            exit 1
          fi

  deploy:
    name: Build → push (ghcr) → deploy to lifekit-vps
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    concurrency:
      group: deploy-lifekit-vps
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/lifekit-hq
    steps:
      - uses: actions/checkout@v4

      # If a tag input is given we skip build and just (re)deploy that tag —
      # this is the rollback path (deploy a prior SHA without a source revert).
      - name: Resolve build identity
        id: id
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "deploy_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "do_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_tag=${SHA}" >> "$GITHUB_OUTPUT"
            echo "do_build=true" >> "$GITHUB_OUTPUT"
          fi

      # Unconditional — the deploy step PULLS the (private) package even when
      # the build is skipped; gating login on do_build broke every tag/rollback
      # dispatch with "error from registry: denied" (dashboard cutover,
      # 2026-08-16).
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # devclaw-mcp — built FROM the checked-out source (COPY, no git clone),
      # SHA baked so /health reports exactly this commit. Cache-respecting.
      - name: Build + push devclaw-mcp
        if: steps.id.outputs.do_build == 'true'
        run: |
          SHA="${{ steps.id.outputs.sha }}"
          docker build -f deploy/Dockerfile \
            --build-arg DEVCLAW_GIT_SHA="${SHA}" \
            --build-arg DEVCLAW_BUILT_AT="${{ steps.id.outputs.built_at }}" \
            -t "${REGISTRY}/devclaw-mcp:${SHA}" \
            -t "${REGISTRY}/devclaw-mcp:latest" .
          docker push "${REGISTRY}/devclaw-mcp:${SHA}"
          docker push "${REGISTRY}/devclaw-mcp:latest"

      # devclaw-sandbox — the per-task image the MCP server spawns, built from
      # the SAME source (.sandcastle/Dockerfile) so it matches the MCP version
      # without the md5-verify crutch (FR-002).
      - name: Build + push devclaw-sandbox
        if: steps.id.outputs.do_build == 'true'
        run: |
          SHA="${{ steps.id.outputs.sha }}"
          docker build -f .sandcastle/Dockerfile \
            -t "${REGISTRY}/devclaw-sandbox:${SHA}" \
            -t "${REGISTRY}/devclaw-sandbox:latest" .
          docker push "${REGISTRY}/devclaw-sandbox:${SHA}"
          docker push "${REGISTRY}/devclaw-sandbox:latest"

      # Scoped deploy — pulls the tag, recreates ONLY the devclaw project,
      # verifies /health, fails loud. OpenClaw-side containers are untouched.
      - name: Deploy (scoped, readiness-gated)
        # Every credential the instance cannot run without rides in from the
        # repo secrets — the source of truth. deploy-devclaw.sh writes them into
        # the on-box secrets file the compose file declares as its env_file
        # (/srv/devclaw/secrets.env, 0600), so a later recreate from the box —
        # by ANY path — reads the same values instead of resolving to blank
        # (2026-09-03). Unset/blank or malformed ⇒ the script dies BEFORE
        # touching the box; the container refuses to start without them.
        env:
          # subscription OAuth setup-token: host cognition + sandbox auth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # read:packages registry token: in-sandbox `npm ci` on @lifekit-hq
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          # host-side GitHub (`repo` + `actions:read`): delivery push/PR/merge,
          # intake, the issue doorway, and the failing-job log read that feeds a
          # red-CI correction. NOT `secrets.GITHUB_TOKEN` — that is the job's
          # own hourly-expiring token, and GitHub forbids a `GITHUB_`-prefixed
          # secret name, which is why the registry spells this one GH_TOKEN.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # the auto lane's instance-dead relay ping target (optional secret;
          # unset ⇒ the wrapper skips the ping, everything else unchanged)
          DEVCLAW_NOTIFY_URL: ${{ secrets.DEVCLAW_NOTIFY_URL }}
        run: |
          if [ "${{ github.event.inputs.auto }}" = "true" ]; then
            bash deploy/deploy-devclaw-auto.sh "${{ steps.id.outputs.deploy_tag }}"
          else
            bash deploy/deploy-devclaw.sh "${{ steps.id.outputs.deploy_tag }}"
          fi
