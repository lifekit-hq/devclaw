name: Weekly Release

# Cuts a release once a week by merging the Release Please PR that accumulates on main.
# Release Please keeps that PR current on every merge; this job just lands it on a cadence.
# No releasable commits since the last release → no PR → the job no-ops.
#
# The merge uses the release-bot app token (the same app release-please.yml pushes
# with), so it is a real push to main: Release Please tags + publishes the release
# through its own push trigger — no explicit dispatch is needed.
#
# Unlike finance-sentry there is NO deploy dispatch here: devclaw deploys to the VPS
# via lifekit-stack's redeploy-devclaw.sh, run by the owner (the run window resets
# and live goals make deploys an operator decision, not a cron's).

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC
  workflow_dispatch:  # manual "release now"

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    uses: lifekit-hq/.github/.github/workflows/weekly-release.yml@v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
