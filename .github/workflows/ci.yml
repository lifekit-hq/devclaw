name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NB: every job stays on self-hosted. devclaw is a PUBLIC repo but already
  # runs the strict all_external_contributors policy, and its tests may
  # depend on the VPS sandbox — hosted runners are not a fit here even though
  # they work fine for this repo's release-please job.
  ci:
    name: Tests + Lint (pytest, ruff, mypy, import-linter, yamllint)
    uses: lifekit-hq/.github/.github/workflows/python-ci.yml@v1
    with:
      runner: '"self-hosted"'
      install: -e '.[dev]'
      cache-key-files: "pyproject.toml"
      run: |
        set -euo pipefail
        TMPDIR=$(mktemp -d -p "$RUNNER_TEMP") python -m pytest -q
        ruff check --output-format=github .
        mypy
        lint-imports
        yamllint \
          -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' \
          .github/workflows/

  # The Angular console (frontend/): lint, unit tests, the production build,
  # then Playwright against that build with the feeds answered from fixtures.
  frontend:
    name: Frontend (lint, test, build, e2e)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read  # @lifekit-hq/* from GitHub Packages
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint (ng lint)
        run: npm run lint
      - name: Test (ng test, vitest runner)
        run: npm test
      - name: Build (ng build)
        run: npm run build
      - name: E2E (Playwright on the built dist)
        run: |
          npx playwright install chromium
          npm run e2e

  secrets-scan:
    name: Secrets scan (gitleaks)
    uses: lifekit-hq/.github/.github/workflows/secrets-scan.yml@v1
    with:
      runner: '"self-hosted"'

# NB: there is deliberately NO deploy job here. A merge to main runs tests +
# lint only — it MUST NOT rebuild-and-recreate the live VPS mid-run (spec 005,
# FR-008), which used to SIGKILL in-flight overnight goal sandboxes. Deploy is
# operator-triggered via .github/workflows/deploy.yml (workflow_dispatch).
