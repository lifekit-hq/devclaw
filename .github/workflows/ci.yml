name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job runs on a GitHub-hosted runner: the suite is fully stubbed (no
  # docker, no claude), and on the box's self-hosted runner CI queued behind
  # deploys. The box keeps only what must run there — deploy.yml's arm and
  # deploy jobs.
  ci:
    name: Tests + Lint (pytest, ruff, mypy, import-linter, yamllint)
    uses: lifekit-hq/.github/.github/workflows/python-ci.yml@v1
    with:
      # the Python the devclaw-mcp image runs (node:22-trixie ships 3.13)
      python-version: "3.13"
      install: -e '.[dev]'
      run: |
        set -euo pipefail
        TMPDIR=$(mktemp -d -p "$RUNNER_TEMP") python -m pytest -q
        ruff check --output-format=github .
        mypy
        lint-imports
        yamllint \
          -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' \
          .github/workflows/

  # The Angular console (frontend/): lint, unit tests, the production build,
  # then Playwright against that build with the feeds answered from fixtures.
  frontend:
    name: Frontend (lint, test, build, e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # @lifekit-hq/* from GitHub Packages
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint (ng lint)
        run: npm run lint
      - name: Test (ng test, vitest runner)
        run: npm test
      - name: Build (ng build)
        run: npm run build
      - name: E2E (Playwright on the built dist)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  secrets-scan:
    name: Secrets scan (gitleaks)
    uses: lifekit-hq/.github/.github/workflows/secrets-scan.yml@v1

# NB: there is deliberately NO deploy job here. A merge to main runs tests +
# lint only — it MUST NOT rebuild-and-recreate the live VPS mid-run (spec 005,
# FR-008), which used to SIGKILL in-flight overnight goal sandboxes. Images are
# built off the box by docker-build.yml; the deploy runs through
# .github/workflows/deploy.yml (workflow_dispatch, armed by a published build).
