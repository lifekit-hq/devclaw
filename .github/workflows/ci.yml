name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # NB: every job is runs-on: self-hosted. GitHub-hosted runners are blocked by
  # the account billing-lock ("job was not started because your account is
  # locked") — anything on ubuntu-latest never starts. The lifekit-vps runner is
  # the only working compute, same as lifekit-stack's CI.
  test:
    name: Tests (pytest)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # setup-python@v5 can't provision Python on this arm64 Debian runner; use
      # the system python3 (+ python3-venv from bootstrap) in a throwaway venv.
      - name: pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e '.[dev]'
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

  lint:
    name: Lint (markdown + secrets)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # gitleaks via pinned binary (arm64) — exit code is the gate; scans the
      # working tree for secrets. Avoids the gitleaks-action's license + the
      # account-lock's artifact-quota SARIF-upload failure.
      # Download is retried, sha256-pinned, and cached on the self-hosted
      # runner so a network flake (2026-08-12: `curl: (56) Connection died`
      # mid-download painted a PR red) reads as "download failed (infra)",
      # never as a secrets finding.
      - name: gitleaks
        run: |
          VERSION=8.21.2
          # sha256 of gitleaks_8.21.2_linux_arm64.tar.gz from the official
          # release asset gitleaks_8.21.2_checksums.txt at
          # https://github.com/gitleaks/gitleaks/releases/tag/v8.21.2
          SHA256=654c935542c89f565aabe7bf7c6c500830f116c114f0aeb509d2460c1ac2e6da
          CACHE_DIR="$HOME/.cache/gitleaks/${VERSION}"
          TARBALL="${CACHE_DIR}/gitleaks_${VERSION}_linux_arm64.tar.gz"
          if ! echo "${SHA256}  ${TARBALL}" | sha256sum -c --status 2>/dev/null; then
            mkdir -p "${CACHE_DIR}"
            if ! curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
                "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_arm64.tar.gz" \
                -o "${TARBALL}.tmp"; then
              echo "::error::gitleaks download failed (infra) — NOT a secrets finding; retry the job"
              exit 1
            fi
            if ! echo "${SHA256}  ${TARBALL}.tmp" | sha256sum -c --status; then
              echo "::error::gitleaks download checksum mismatch (infra) — NOT a secrets finding"
              rm -f "${TARBALL}.tmp"
              exit 1
            fi
            mv "${TARBALL}.tmp" "${TARBALL}"
          fi
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      - name: yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint-venv"
          "$RUNNER_TEMP/yamllint-venv/bin/pip" install --quiet yamllint
          "$RUNNER_TEMP/yamllint-venv/bin/yamllint" \
            -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' \
            .github/workflows/ 2>&1 || true

  # NB: there is deliberately NO deploy job here. A merge to main runs tests +
  # lint only — it MUST NOT rebuild-and-recreate the live VPS mid-run (spec 005,
  # FR-008), which used to SIGKILL in-flight overnight goal sandboxes. Deploy is
  # operator-triggered via .github/workflows/deploy.yml (workflow_dispatch).
