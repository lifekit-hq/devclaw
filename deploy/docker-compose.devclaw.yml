# devclaw's OWN compose project — brings devclaw up independently of the
# OpenClaw/lifekit-stack project (spec 005). Run it as its own project:
#
#   docker compose -p devclaw --env-file /srv/devclaw/.env \
#       -f deploy/docker-compose.devclaw.yml up -d
#
# (The two credentials come from the secrets file declared below, NOT from
# the shell or --env-file — so that command yields the same container the
# deploy workflow made. See docs/runbooks/devclaw-self-deploy.md §1.)
#
# vs. lifekit-stack, which keeps the OpenClaw project (gateway, cli, dashboard,
# notify-relay, google-workspace-mcp). The two projects stay integrated at
# RUNTIME through shared, externally-declared seams — the `lifekit-shared`
# network and the `devclaw-state` volume — so neither project owns the other.
#
# Images are pulled by tag from ghcr.io (built on a GitHub-hosted arm64 runner
# and pushed by devclaw's .github/workflows/docker-build.yml). No `build:`
# here — deploy pulls, never builds.
# The former ops-agent watchdog is gone (tinyspec deadman-metrics, 2026-09-06):
# devclaw-mcp exposes /metrics and the box's Prometheus + Grafana (lifekit-stack)
# hold the dead-man alert. Its docker-socket mount and read-only state mounts
# went with it, and devclaw-mcp's own socket mount went with the per-session
# docker sandbox (#952): every session is `claude -p` in a treehouse worktree
# inside this container.
#
# The `devclaw-state` volume (devclaw.db + goals) and the `lifekit-shared`
# network are declared `external` so they keep their identity across the
# cutover and across recreates — see docs/runbooks/devclaw-self-deploy.md for
# the one-time adoption order that preserves durable goal state.

x-policy:
  policy: &policy
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

services:
  devclaw-mcp:
    <<: *policy
    # DevClaw v2 — autonomous coding runtime exposed via streamable-http MCP.
    # Image is built from the checked-out source (deploy/Dockerfile) and pulled
    # by SHA tag; the running SHA is surfaced on /health + /node.json (#494).
    image: ${DEVCLAW_MCP_IMAGE:-ghcr.io/lifekit-hq/devclaw-mcp:latest}
    deploy:
      resources:
        limits:
          # Every session — the `claude -p` process and the repository's own
          # verify run — lives inside this one limit, DEVCLAW_MAX_CONCURRENT
          # at a time. Size it for that many sessions plus the server.
          memory: ${DEVCLAW_MCP_MEMORY:-3g}
    # The two credentials the instance cannot run without — the subscription
    # OAuth setup-token (session cognition) and the read:packages registry
    # token (a session's `npm ci`) — have ONE durable home: the on-box
    # secrets file declared here. deploy/deploy-devclaw.sh writes it from the
    # repo's Actions secrets on every run; a hand `docker compose up` from the
    # box reads the same file, so every creation path yields the same
    # container. Declared in THIS file (not as a --env-file flag) so no
    # invocation can omit it; a missing file fails `up` (a declared env_file
    # is required). They are deliberately NOT in the `environment:` block:
    # `${VAR:-}` there resolves to blank without a shell env and OVERRIDES the
    # file — the 2026-09-03 recreate that wiped both. And devclaw refuses to
    # start without them (devclaw/boot_guard.py), so nothing runs degraded.
    env_file:
      - ${DEVCLAW_SECRETS_FILE:-/srv/devclaw/secrets.env}
    environment:
      DEVCLAW_TRANSPORT: http
      DEVCLAW_PORT: "8000"
      DEVCLAW_DB: /var/lib/devclaw/devclaw.db
      # Goal-layer milestone notifications → notify-relay (in the OpenClaw
      # project, reachable over the shared external network by service name).
      DEVCLAW_GOAL_NOTIFY_URL: http://notify-relay:8090/text
      # fastmcp >= 3.4 HostOriginGuard: allowlist the docker-network MCP host and
      # the tailnet console host (else 421 / 403 on non-loopback routes).
      FASTMCP_HTTP_ALLOWED_HOSTS: ${FASTMCP_HTTP_ALLOWED_HOSTS:-["devclaw-mcp:8000","lifekit-vps.tail1cb676.ts.net:18791"]}
      FASTMCP_HTTP_ALLOWED_ORIGINS: ${FASTMCP_HTTP_ALLOWED_ORIGINS:-["https://lifekit-vps.tail1cb676.ts.net:18791"]}
      CLAUDE_CODE_EXECUTABLE: /usr/local/bin/claude
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # CLAUDE_CODE_OAUTH_TOKEN + NODE_AUTH_TOKEN + GH_TOKEN: see env_file
      # above — never here (an `environment:` entry would override the file
      # with blank). GH_TOKEN also supersedes the ~/.config/gh mount below for
      # every `gh` call and for git's `gh auth git-credential` helper; the
      # mount stays until a live push has proven the env path.
      # Session concurrency cap. Without this substitution line an env-file
      # setting never reaches the container (the silent-no-op trap). 1 =
      # strictly serial — the unattended-week mode: concurrent sessions
      # contend for one account quota, and on 2026-08-29 that killed six tasks
      # with nothing delivered. Default mirrors devclaw/config.py.
      DEVCLAW_MAX_CONCURRENT: ${DEVCLAW_MAX_CONCURRENT:-4}
      # The engine dials — everything engine/claude.py reads. Same trap: without
      # a line here an env-file setting is inert on the deployed instance.
      # tests/test_env_vars_doc_sync.py fails if a new dial lands without one.
      DEVCLAW_EXEC_MODEL: ${DEVCLAW_EXEC_MODEL:-}
      DEVCLAW_CLAUDE_BIN: ${DEVCLAW_CLAUDE_BIN:-claude}
      DEVCLAW_FIRST_FRAME_S: ${DEVCLAW_FIRST_FRAME_S:-120}
      DEVCLAW_SILENCE_S: ${DEVCLAW_SILENCE_S:-1800}
      DEVCLAW_VERIFY_ROUNDS: ${DEVCLAW_VERIFY_ROUNDS:-3}
      DEVCLAW_VERIFY_TIMEOUT_S: ${DEVCLAW_VERIFY_TIMEOUT_S:-900}
      DEVCLAW_SELF_REPO: ${DEVCLAW_SELF_REPO:-}
      # Git author/committer identity for every commit devclaw produces
      # (devclaw/git_identity.py, set on each session). Blank ⇒ the
      # code default (`devclaw <devclaw@local>`); point DEVCLAW_GIT_EMAIL at a
      # bot's GitHub noreply address to link the commits to a real profile.
      DEVCLAW_GIT_NAME: ${DEVCLAW_GIT_NAME:-}
      DEVCLAW_GIT_EMAIL: ${DEVCLAW_GIT_EMAIL:-}
      TZ: ${OPENCLAW_TZ:-UTC}
      # Point git's credential helper at gh's stored token (private-repo clone).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
    volumes:
      # Durable state — devclaw.db + goals. External volume: survives recreates
      # AND the cutover from the lifekit-stack project (goal-safety, FR-009).
      - devclaw-state:/var/lib/devclaw
      # Workspaces — the project checkouts and the treehouse pool of per-goal
      # worktrees (TREEHOUSE_ROOT in the image), on the host so a lease
      # survives a recreate.
      - ${LIFEKIT_DEVCLAW_WORKSPACES:-/srv/devclaw/workspaces}:/var/lib/devclaw/workspaces
      # Host tailscaled control socket — `tailscale serve` for durable deploys.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      # Claude Code OAuth — inherited from the host session (no API key, ever).
      - ${LIFEKIT_CLAUDE_HOME:-/home/lifekit/.claude}:/home/node/.claude
      - ${LIFEKIT_CLAUDE_JSON:-/home/lifekit/.claude.json}:/home/node/.claude.json
      # The /srv/memory vault — trend retrospectives + self-reflection reads.
      - ${LIFEKIT_LIFE_DIR:-/srv/memory}:/home/node/memory
      # gitconfig: commit authorship AND the `gh auth git-credential` helper
      # that every https remote operation resolves through. The gh CONFIG mount
      # that used to sit beside it is gone (2026-09-09, the follow-up in
      # specs/tiny/github-credential-in-the-registry.md): GH_TOKEN in the env is
      # the credential's one home and `gh` ranks it above any config file, so a
      # second source here could only ever mask the env path being broken.
      - ${LIFEKIT_GITCONFIG:-/home/lifekit/.gitconfig}:/home/node/.gitconfig:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    # Loopback-only host binding for the console/dashboard SSE feed, reached via
    # an SSH tunnel (ssh -L 18791:127.0.0.1:18791 lifekit-vps). The /mcp hop
    # from the gateway stays on the shared network.
    ports:
      - "127.0.0.1:18791:8000"
    networks:
      - default
      - lifekit-shared
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fs http://127.0.0.1:8000/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s


volumes:
  # Durable goal state. Declared external so the two-project split does NOT
  # re-namespace it. On the CUTOVER host the existing volume is named
  # `compose_devclaw-state` (it was owned by the shared `compose` project); set
  #   DEVCLAW_STATE_VOLUME=compose_devclaw-state
  # in the env file to ADOPT IT IN PLACE — zero copy, same bytes, no goal loss
  # (FR-009). A fresh host uses the default `devclaw-state`. See the runbook.
  devclaw-state:
    external: true
    name: ${DEVCLAW_STATE_VOLUME:-devclaw-state}

networks:
  # Cross-project runtime seam: devclaw-mcp ⇄ notify-relay and gateway →
  # devclaw-mcp resolve each other by service name here. lifekit-stack attaches
  # its gateway + notify-relay to the same external network. Create once:
  #   docker network create lifekit-shared
  lifekit-shared:
    external: true
